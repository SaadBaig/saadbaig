<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="100" viewBox="0 0 1000 100" fill="none" role="img" aria-label="Saad Baig — Security Engineer — Attacking and Securing the Digital World">
  <style>
    .txt {
      font-family: 'Fira Code', 'Cascadia Code', 'JetBrains Mono', Consolas, monospace;
      font-size: 40px;
      font-weight: 600;
      fill: #00FF41;
      dominant-baseline: middle;
      text-anchor: start;
    }
  </style>

  <!-- Blinking caret: a thin bar that sits after the text and blinks forever.
       It is moved horizontally per line via its own transform animation. -->
  <g transform="translate(0,50)">
    <!-- LINE 1: "Saad Baig" -->
    <g>
      <clipPath id="clip1"><rect x="0" y="-30" width="0" height="60">
        <animate attributeName="width" begin="0s"    dur="1.2s" values="0;250"  fill="freeze"/>
        <animate attributeName="width" begin="4s"    dur="0.6s" values="250;0"  fill="freeze"/>
      </rect></clipPath>
      <text class="txt" x="375" y="0" clip-path="url(#clip1)">Saad Baig</text>
      <g opacity="0">
        <animate attributeName="opacity" begin="0s" dur="12s" values="1;1;0;0;0" keyTimes="0;0.38;0.42;0.9;1" repeatCount="indefinite"/>
        <rect class="caret" x="378" y="-24" width="4" height="48" fill="#00FF41">
          <!-- ride along as line 1 types, then park at the end -->
          <animate attributeName="x" begin="0s" dur="1.2s" values="378;628" fill="freeze"/>
          <animate attributeName="x" begin="4s" dur="0.6s" values="628;378" fill="freeze"/>
          <animate attributeName="opacity" values="1;1;0;0" dur="1s" repeatCount="indefinite"/>
        </rect>
      </g>
    </g>

    <!-- LINE 2: "Security Engineer" -->
    <g opacity="0">
      <animate attributeName="opacity" begin="0s" dur="12s" values="0;0;1;1;0;0" keyTimes="0;0.36;0.4;0.72;0.76;1" repeatCount="indefinite"/>
      <clipPath id="clip2"><rect x="0" y="-30" width="0" height="60">
        <animate attributeName="width" begin="4.5s" dur="1.6s" values="0;360" fill="freeze"/>
        <animate attributeName="width" begin="8s"   dur="0.6s" values="360;0" fill="freeze"/>
      </rect></clipPath>
      <text class="txt" x="320" y="0" clip-path="url(#clip2)">Security Engineer</text>
      <rect class="caret" x="323" y="-24" width="4" height="48" fill="#00FF41">
        <animate attributeName="x" begin="4.5s" dur="1.6s" values="323;683" fill="freeze"/>
        <animate attributeName="x" begin="8s"   dur="0.6s" values="683;323" fill="freeze"/>
        <animate attributeName="opacity" values="1;1;0;0" dur="1s" repeatCount="indefinite"/>
      </rect>
    </g>

    <!-- LINE 3: "Attacking & Securing the Digital World" -->
    <g opacity="0">
      <animate attributeName="opacity" begin="0s" dur="12s" values="0;0;1;1;0" keyTimes="0;0.7;0.74;0.98;1" repeatCount="indefinite"/>
      <clipPath id="clip3"><rect x="0" y="-30" width="0" height="60">
        <animate attributeName="width" begin="8.6s"  dur="2.4s" values="0;760" fill="freeze"/>
        <animate attributeName="width" begin="11.6s" dur="0.4s" values="760;0" fill="freeze"/>
      </rect></clipPath>
      <text class="txt" x="120" y="0" clip-path="url(#clip3)">Attacking &amp; Securing the Digital World</text>
      <rect class="caret" x="123" y="-24" width="4" height="48" fill="#00FF41">
        <animate attributeName="x" begin="8.6s"  dur="2.4s" values="123;883" fill="freeze"/>
        <animate attributeName="x" begin="11.6s" dur="0.4s" values="883;123" fill="freeze"/>
        <animate attributeName="opacity" values="1;1;0;0" dur="1s" repeatCount="indefinite"/>
      </rect>
    </g>
  </g>
</svg>
